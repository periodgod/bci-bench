[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wyu-bci-bench"
version = "0.2.0"
description = "Private EEG data analysis and model benchmark toolkit for WYU BCI projects."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
]

[project.optional-dependencies]
signal = ["scipy>=1.10"]
ml = ["torch>=2.0", "scikit-learn>=1.3", "scipy>=1.10"]
peft = ["torch>=2.0", "peft>=0.13"]
brainomni = ["torch>=2.4", "mne>=1.6", "einops>=0.8", "einx==0.3.0", "vector-quantize-pytorch==1.22.10", "peft>=0.13"]
braindecode = ["torch>=2.0", "braindecode>=1.8,<2"]
eegmamba = ["torch>=2.0", "mamba-ssm>=2.2.4"]
geometric-csp = ["torch>=2.0", "geoopt>=0.5"]
csp = ["mne>=1.6", "scikit-learn>=1.3", "scipy>=1.10"]
ssvep = ["mne>=1.6", "moabb>=1.7,<2", "scipy>=1.10"]
biot = ["torch>=2.0", "scipy>=1.10", "linear-attention-transformer>=0.19,<1"]
eegpt = ["torch>=2.0", "scipy>=1.10", "safetensors>=0.4"]
domain-adaptation = ["pyriemann>=0.7,<1", "scipy>=1.10", "torch>=2.0"]
xgb = ["xgboost>=2.0"]
all = ["scipy>=1.10", "torch>=2.0", "safetensors>=0.4", "xgboost>=2.0", "scikit-learn>=1.3", "mne>=1.6", "moabb>=1.7,<2", "pyriemann>=0.7,<1", "linear-attention-transformer>=0.19,<1"]
dev = ["pytest>=7.0", "scipy>=1.10", "scikit-learn>=1.3"]

[project.scripts]
wyu-bci-bench = "wyu_bci_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wyu_bci_bench._third_party.brainomni" = ["LICENSE", "UPSTREAM.json"]
